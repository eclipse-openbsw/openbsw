components:
  - &foo_provider
    name: FooProvider
    providedPorts:
      - name: foo
        interfaceName: Foo
        interfaceNamespace: org::test::foo
  - &foo_consumer
    name: FooConsumer
    requiredPorts:
      - name: foo
        interfaceName: Foo
        interfaceNamespace: org::test::foo

clusters:
  - &cluster0
    name: Cluster0
    id: 0
    queueSize: 10
    componentInstances:
      - instanceName: provider
        component: *foo_provider
  - &cluster1
    name: Cluster1
    id: 1
    queueSize: 10
    componentInstances:
      - instanceName: consumer
        component: *foo_consumer

# Infrastructure allocators for memory management
allocators:
  - name: Main
    default: true
    pools:
      - NumberOfElements: 10
        ChunkSize: 64
  - name: Custom
    pools:
      - NumberOfElements: 4
        ChunkSize: 128

typeModules:
  - namespace: org::test::foo::Foo
    header: org/test/foo/FooTypes.h
    types:
      - typeName: StructTypeDef
        name: FooStruct
        elements:
          - name: fooValue
            type: uint32_t

services:
  - &foo
    namespace: org::test::foo
    name: Foo
    deployment:
      ServiceID: 1
      MemoryAllocator: Custom
    typeIncludes:
      - org/test/foo/FooTypes.h
    attributes:
      # Default behavior: setter + getter + subscriptions allowed
      - name: FooDefault
        type: org::test::foo::Foo::FooStruct
        hasGetter: true
        hasSetter: true
        hasNotifier: true
        deployment:
          GetterID: 1
          SetterID: 2
          NotificationID: 128
          Timeout: 5000
          SetterWithResponse: false
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1

    commonInclude: org/test/foo/FooCommon.h
    proxyInclude: org/test/foo/FooProxy.h
    skeletonInclude: org/test/foo/FooSkeleton.h

connections:
  - &cluster0_cluster1
    source_cluster: *cluster0
    target_cluster: *cluster1
    proxies: []
    skeletons:
      - <<: *foo
        max_instances: 1
  - &cluster1_cluster0
    source_cluster: *cluster1
    target_cluster: *cluster0
    proxies:
      - <<: *foo
        max_instances: 1
    skeletons: []

cores:
  - &c0
    name: C0
    clusters:
      - *cluster0
  - &c1
    name: C1
    clusters:
      - *cluster1
