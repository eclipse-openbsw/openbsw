name: Bazel Build and Test

on:
  workflow_call:
  push:
    branches:
      - main
  pull_request:

jobs:
  bazel-ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Docker Environment
        uses: ./.github/actions/setup-docker-env

      # Fails if bazel --version fails in the docker container
      - name: Bazel smoke test
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel version

      # Fails if MODULE.bazel.lock is stale (invalid versions, yanked modules, extension errors).
      # Fix locally with: bazel mod tidy --lockfile_mode=update
      - name: Check Bazel lockfile
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel mod deps --lockfile_mode=error

      # Fails if any BUILD/.bzl file is not formatted correctly.
      # Fix locally with: bazel run //:format_fix
      - name: Check Bazel formatting
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel run //:format_check

      # Parses all BUILD files and resolves the dependency graph without compiling.
      # Catches syntax errors, invalid labels, missing targets, and dependency cycles.
      - name: Query all targets
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel query //...

      # Compiles all targets for the host platform (Linux/posix).
      # Targets with incompatible platform constraints are skipped automatically.
      - name: Build all targets (host platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build //...

      # Cross-compiles all targets for the S32K148 platform (FreeRTOS) using arm-none-eabi-gcc.
      - name: Build all targets (s32k148 platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build --config=s32k148 //...

      # Cross-compiles all targets for the S32K148 platform with ThreadX RTOS.
      # Matches the CMake s32k148-threadx preset in the build matrix.
      - name: Build all targets (s32k148 ThreadX platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build --config=s32k148_threadx //...

      # Cross-compiles all targets for the STM32G474RE platform (FDCAN) using arm-none-eabi-gcc.
      # Matches the CMake tests-stm32-* and posix-freertos-canfd presets.
      - name: Build all targets (stm32g4 platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build --config=stm32g4 //...

      # Cross-compiles all targets for the STM32F413ZH platform (BxCAN) using arm-none-eabi-gcc.
      - name: Build all targets (stm32f4 platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build --config=stm32f4 //...

      # Compiles all test targets for the posix unit-test platform without running them.
      # A failure here is a compilation error not a failed test.
      - name: Build all targets (posix_unit_test platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bazel build --platforms=//bazel/platform:posix_unit_test //...

      # Runs all tests on the posix unit-test platform.
      # Exit code 4 (no tests found) is treated as success.
      - name: Run all tests (posix_unit_test platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bash -c 'bazel test //... || ec=$?; [ "${ec:-0}" -eq 0 ] || [ "$ec" -eq 4 ] || exit "$ec"'

      # Runs all tests on the STM32G474RE unit-test platform (adds stm32g4 SoC constraint).
      # Exit code 4 (no tests found) is treated as success.
      - name: Run all tests (stm32g4_unit_test platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bash -c 'bazel test --config=stm32g4_unit_test //... || ec=$?; [ "${ec:-0}" -eq 0 ] || [ "$ec" -eq 4 ] || exit "$ec"'

      # Runs all tests on the STM32F413ZH unit-test platform (adds stm32f4 SoC constraint).
      # Exit code 4 (no tests found) is treated as success.
      - name: Run all tests (stm32f4_unit_test platform)
        run: >-
          DOCKER_UID=$(id -u) DOCKER_GID=$(id -g) DOCKER_HISTORY=/dev/null
          docker compose run --rm development
          bash -c 'bazel test --config=stm32f4_unit_test //... || ec=$?; [ "${ec:-0}" -eq 0 ] || [ "$ec" -eq 4 ] || exit "$ec"'


