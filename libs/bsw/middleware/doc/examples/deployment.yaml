# Service-oriented example deployment configuration for middleware documentation
# This configuration demonstrates service-based communication patterns

components:
  - &dummy_provider
    name: DummyProvider
    providedPorts:
      - name: dummy
        interfaceName: DummyService
        interfaceNamespace: features::communication
  - &dummy_consumer
    name: DummyConsumer
    requiredPorts:
      - name: dummy
        interfaceName: DummyService
        interfaceNamespace: features::communication

clusters:
  - &core0
    name: Core0
    id: 0
    queueSize: 10
    componentInstances:
      - instanceName: provider
        component: *dummy_provider
  - &core1
    name: Core1
    id: 1
    queueSize: 10
    componentInstances:
      - instanceName: consumer
        component: *dummy_consumer

allocators:
  - name: Main
    default: true
    pools:
      - NumberOfElements: 10
        ChunkSize: 64
      - NumberOfElements: 1
        ChunkSize: 8208

pdus:
  - name: samplePduWithCrc
    size: 8
    namespace: features::communication
    headers:
      common: features/communication/samplePduWithCrcCommon.h
      reader: features/communication/samplePduWithCrcReader.h
      reader_mock: features/communication/samplePduWithCrcReaderMock.h
    signals:
      - name: crc
        type: uint8_t
        bit_length: 8
      - name: firstSignal
        type: uint8_t
        bit_length: 8
      - name: secondSignal
        type: uint16_t
        bit_length: 16
      - name: thirdSignal
        type: uint32_t
        bit_length: 32

typeModules:
  - namespace: features::communication::DummyService
    header: features/communication/dummy_serviceTypes.h
    types:
      - typeName: StructTypeDef
        name: Foo
        elements:
          - name: x
            type: uint32_t
          - name: y
            type: uint32_t
      - typeName: StructTypeDef
        name: Bar
        elements:
          - name: z
            type: uint16_t
          - name: w
            type: uint16_t
      - typeName: StructTypeDef
        name: Baz
        elements:
          - name: a
            type: uint8_t
          - name: b
            type: uint8_t
          - name: c
            type: uint8_t
          - name: d
            type: uint8_t
      - typeName: StructTypeDef
        name: FireAndForgetPayload
        elements:
          - name: foo
            type: Foo
          - name: bar
            type: Bar

services:
  - &dummy_service
    namespace: features::communication
    name: DummyService
    filename: dummy_service
    deployment:
      ServiceID: 10
    typeIncludes:
      - features/communication/dummy_serviceTypes.h
    attributes:
      - name: SimpleField
        type: uint32_t
        hasGetter: true
        hasSetter: true
        hasNotifier: true
        deployment:
          GetterID: 1
          SetterID: 2
          NotificationID: 128
          Timeout: 300
          SetterWithResponse: false
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1
    methods:
      - name: AsyncMethod
        deployment:
          MethodID: 3
          Timeout: 1000
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1
        inArgs:
          - name: fooParam
            type: features::communication::DummyService::Foo
        outArgs:
          - name: result
            type: features::communication::DummyService::Baz
      - name: FireAndForgetMethod
        fireAndForget: true
        deployment:
          MethodID: 4
          Timeout: 300
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1
        inArgs:
          - name: payload
            type: features::communication::DummyService::FireAndForgetPayload
    broadcasts:
      - name: SimpleBroadcast
        type: uint32_t
        deployment:
          NotificationID: 129
    commonInclude: features/communication/dummy_serviceCommon.h
    proxyInclude: features/communication/dummy_serviceProxy.h
    skeletonInclude: features/communication/dummy_serviceSkeleton.h
    proxyMockInclude: features/communication/dummy_serviceProxyMock.h
    skeletonMockInclude: features/communication/dummy_serviceSkeletonMock.h

connections:
  - source_cluster: *core0
    target_cluster: *core1
    proxies: []
    skeletons:
      - <<: *dummy_service
        max_instances: 1
  - source_cluster: *core1
    target_cluster: *core0
    proxies:
      - <<: *dummy_service
        max_instances: 1
    skeletons: []

cores:
  - name: C0
    clusters:
      - *core0
  - name: C1
    clusters:
      - *core1
