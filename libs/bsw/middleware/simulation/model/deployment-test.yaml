components:
  - &foo_provider
    name: FooProvider
    providedPorts:
      - name: foo
        interfaceName: Foo
        interfaceNamespace: org::test::foo
  - &foo_consumer
    name: FooConsumer
    requiredPorts:
      - name: foo
        interfaceName: Foo
        interfaceNamespace: org::test::foo

clusters:
  - &cluster0
    name: Cluster0
    id: 0
    queueSize: 10
    componentInstances:
      - instanceName: provider
        component: *foo_provider
  - &cluster1
    name: Cluster1
    id: 1
    queueSize: 10
    componentInstances:
      - instanceName: consumer
        component: *foo_consumer

# Infrastructure allocators for memory management
allocators:
  - name: Main
    default: true
    pools:
      - NumberOfElements: 10
        ChunkSize: 64

pdus:
  - name: samplePduWithCrc
    size: 8
    namespace: org::test::signal
    headers:
      common: org/test/signal/samplePduWithCrcCommon.h
      reader: org/test/signal/samplePduWithCrcReader.h
    signals:
      - name: crc
        type: uint8_t
        bit_length: 8
      - name: sampleSignal
        type: uint8_t
        bit_length: 4
      - name: AnotherSampleSignal
        type: uint8_t
        bit_length: 4
      - name: SomeOtherSignal
        type: uint16_t
        bit_length: 16
      - name: finalSampleSignal
        type: uint32_t
        bit_length: 32
  - name: samplePduWithDatatypes
    size: 12
    namespace: org::test::signal
    headers:
      common: org/test/signal/samplePduWithDatatypesCommon.h
      reader: org/test/signal/samplePduWithDatatypesReader.h
    enums:
      - name: ExampleEnum
        type: uint8_t
        parameters:
          - name: Value0
            value: 0
          - name: Value1
            value: 1
          - name: ErrorValue
            value: 127
    bitsets:
      - name: ExampleBitset
        type: uint8_t
        bits:
          - name: enabled
            position: 0
          - name: fault
            position: 1
          - name: active
            position: 2
          - name: locked
            position: 3
          - name: overheated
            position: 4
    signals:
      - name: firstSignal
        type: uint8_t
        bit_length: 5
      - name: secondSignal
        type: uint64_t
        bit_length: 60
      - name: arraySignal
        type: array
        element_type: uint8_t
        bit_length: 16
      - name: enumSignal
        type: ExampleEnum
        bit_length: 7
      - name: bitsetSignal
        type: ExampleBitset
        bit_length: 5
      - name: boolSignal
        type: bool
        bit_length: 1

typeModules:
  - namespace: org::test::foo::Foo
    header: org/test/foo/FooTypes.h
    types:
      - typeName: AliasTypeDef
        name: FooMethodResult
        targetType: "::etl::array<uint32_t, 4>"
      - typeName: StructTypeDef
        name: FooStruct
        elements:
          - name: fooValue
            type: uint32_t

services:
  - &foo
    namespace: org::test::foo
    name: Foo
    deployment:
      ServiceID: 1
    typeIncludes:
      - org/test/foo/FooTypes.h
    attributes:
      # Default behavior: setter + getter + subscriptions allowed
      - name: FooDefault
        type: org::test::foo::Foo::FooStruct
        hasGetter: true
        hasSetter: true
        hasNotifier: true
        deployment:
          GetterID: 1
          SetterID: 2
          NotificationID: 128
          Timeout: 5000
          SetterWithResponse: false
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1

    methods:
      - name: FooMethod
        deployment:
          MethodID: 3
          Timeout: 5000
          MaxProxyRequests: 1
          MaxSkeletonRequests: 1
        inArgs:
          - name: startValue
            type: uint32_t
        outArgs:
          - name: result
            type: "org::test::foo::Foo::FooMethodResult"

    commonInclude: org/test/foo/FooCommon.h
    proxyInclude: org/test/foo/FooProxy.h
    skeletonInclude: org/test/foo/FooSkeleton.h

connections:
  - &cluster0_cluster1
    source_cluster: *cluster0
    target_cluster: *cluster1
    proxies: []
    skeletons:
      - <<: *foo
        max_instances: 1
  - &cluster1_cluster0
    source_cluster: *cluster1
    target_cluster: *cluster0
    proxies:
      - <<: *foo
        max_instances: 1
    skeletons: []

cores:
  - &c0
    name: C0
    clusters:
      - *cluster0
  - &c1
    name: C1
    clusters:
      - *cluster1
