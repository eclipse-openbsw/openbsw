clusters:
  - &cluster0
    name: Cluster0
    id: 0
    queue_size: 10
  - &cluster1
    name: Cluster1
    id: 1
    queue_size: 10

# Infrastructure allocators for memory management
allocators:
  - &default_allocator
    name: default
    pools:
      - elements: 10
        chunk_sizes: 64

pdus:
  - name: samplePduWithCrc
    size: 8
    namespace: org::test::signal
    headers:
      common: org/test/signal/samplePduWithCrcCommon.h
      reader: org/test/signal/samplePduWithCrcReader.h
    signals:
      - name: crc
        type: uint8_t
        bit_length: 8
      - name: sampleSignal
        type: uint8_t
        bit_length: 4
      - name: AnotherSampleSignal
        type: uint8_t
        bit_length: 4
      - name: SomeOtherSignal
        type: uint16_t
        bit_length: 16
      - name: finalSampleSignal
        type: uint32_t
        bit_length: 32
  - name: samplePduWithDatatypes
    size: 12
    namespace: org::test::signal
    headers:
      common: org/test/signal/samplePduWithDatatypesCommon.h
      reader: org/test/signal/samplePduWithDatatypesReader.h
    enums:
      - name: ExampleEnum
        type: uint8_t
        parameters:
          - name: Value0
            value: 0
          - name: Value1
            value: 1
          - name: ErrorValue
            value: 127
    bitsets:
      - name: ExampleBitset
        type: uint8_t
        bits:
          - name: enabled
            position: 0
          - name: fault
            position: 1
          - name: active
            position: 2
          - name: locked
            position: 3
          - name: overheated
            position: 4
    signals:
      - name: firstSignal
        type: uint8_t
        bit_length: 5
      - name: secondSignal
        type: uint64_t
        bit_length: 60
      - name: arraySignal
        type: array
        element_type: uint8_t
        bit_length: 16
      - name: enumSignal
        type: ExampleEnum
        bit_length: 7
      - name: bitsetSignal
        type: ExampleBitset
        bit_length: 5
      - name: boolSignal
        type: bool
        bit_length: 1

services:
  - &foo
    namespace: org::test::foo
    name: Foo
    id: 1
    typedefs:
      - name: FooMethodResult
        type: "::etl::array<uint32_t, 4>"
    datatypes:
      - name: FooStruct
        type: struct
        parameters:
          - name: fooValue
            type: uint32_t
    attributes:
      # Default behavior: setter + getter + subscriptions allowed
      - name: FooDefault
        variable: fooDefault
        type: FooStruct
        readonly: false
        noSubscriptions: false
        setAsMethod: false
        event:
          id: 128
        getter:
          id: 1
          timeout: 5000
        setter:
          id: 2
          timeout: 0
        consumer_request_limit: 1
        provider_request_limit: 1

    methods:
      - name: FooMethod
        variable: fooMethod
        id: 3
        timeout: 5000
        consumer_request_limit: 1
        provider_request_limit: 1
        input_param:
          name: startValue
          type: uint32_t
        output_param:
          name: result
          type: "::org::test::foo::Foo::FooMethodResult"

    headers:
      common: org/test/foo/FooCommon.h
      proxy: org/test/foo/FooProxy.h
      skeleton: org/test/foo/FooSkeleton.h

    deployment:
      instance_ids: [1]
      clusters:
        - cluster: *cluster0
          consumers: 0
          providers:
            instance_ids: [1]
        - cluster: *cluster1
          consumers: 1
          providers:
            instance_ids: []

connections:
  - &cluster0_cluster1
    source_cluster: *cluster0
    target_cluster: *cluster1
    proxies: []
    skeletons:
      - <<: *foo
        max_instances: 1
  - &cluster1_cluster0
    source_cluster: *cluster1
    target_cluster: *cluster0
    proxies:
      - <<: *foo
        max_instances: 1
    skeletons: []

cores:
  - &c0
    name: C0
    clusters:
      - *cluster0
  - &c1
    name: C1
    clusters:
      - *cluster1
